@if (region && cropRect) {
  <div class="manuscript-popup-card shadow-sm border rounded bg-white p-2" style="max-width: 480px; position: absolute; z-index: 1050; top: -75px; left: 10px;">
    <div class="d-flex align-items-center justify-content-between mb-1 pb-1 border-bottom">
      <span class="small fw-bold text-primary"><i class="bi bi-journal-image me-1"></i>{{ region.name }}</span>
      <span class="badge bg-secondary-subtle text-secondary small font-monospace">Folio p.{{ (+$any(region.folio) || 0) + 1 }}</span>
    </div>
    <div class="manuscript-crop-wrap overflow-hidden rounded border position-relative" style="height: 65px; background-color: #f8fafc;">
      @if (cropImageUrl) {
        <div class="manuscript-crop-image"
          [style.background-image]="'url(' + cropImageUrl + ')'"
          [style.background-position]="(-cropRect.x) + '% ' + (-cropRect.y) + '%'"
          [style.background-size]="(10000 / (cropRect.w || 1)) + '% ' + (10000 / (cropRect.h || 1)) + '%'"
          style="width: 100%; height: 100%; background-repeat: no-repeat;">
        </div>
      }
    </div>
  </div>
}
