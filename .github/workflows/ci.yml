name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

# The checks that do not depend on each other run side by side (build, unit tests, two groups of browser tests), and
# on master the site is built while they run: the deploy at the end only publishes what is already built. A run costs
# about as long as its slowest job instead of the sum of all of them.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npx ng build --configuration production

      # The build does not check what templates use: a handler that was never written compiles fine.
      - name: Check template members
        run: node scripts/check-templates.mjs

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

  # Real-browser tests against the dev server (headless Chrome, seeded workspace; the Angular warnings they look for
  # only exist in development mode). Two groups, each with its own dev server, run at the same time.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Opens every page and every settings tab and clicks through the rows that open sources and documents. Fails
          # on console errors, change-detection warnings and settings tabs that render nothing: the kind of break that
          # builds fine and passes every unit test but is dead on arrival. Then the metadata grid: filter "ID ends with
          # GS" through the UI, select all matching rows, delete them through the confirmation dialog and check in
          # IndexedDB that exactly those documents are gone; and the grid as a spreadsheet (typing, ranges, fill, paste,
          # undo, save with real keyboard and mouse events). Then renaming a siglum and merging two sources through the
          # dialog on the source page: the preview before anything is written, the settings that repeat the siglum, the
          # documents moved over, a conflict decided, and the order the push cache holds for the upload and the deletion.
          - name: pages and metadata grid
            poppler: false
            scripts: smoke-e2e metadata-grid-e2e metadata-edit-e2e relations-e2e sigle-e2e fields-e2e replace-e2e
          # Print: all fixtures as one PDF with the page-break rules checked (no heading alone at the bottom of a
          # page, no single system of a line left alone at a page edge); the release gate (export list imported in the
          # metadata grid, documents marked "dontpublish" held back in the print dialog and not in the PDF); placeholder
          # notes on ZIP import (a lone D6/F3 under a word is removed, an F3 inside a real melody stays, a comment on a
          # placeholder note moves onto its syllable); the cover page and the volumes (one PDF per manuscript / region
          # ..., zipped) through the real print dialog; the notation documentation (a Neume Viewer file imported, its neume table and
          # line strips printed, the IIIF server answered by the script). The PDFs are read back with poppler.
          - name: print, release and import
            poppler: true
            scripts: layout-e2e release-e2e volume-rules-e2e arrange-e2e placeholder-import-e2e zip-nested-e2e cover-e2e description-e2e notation-doc-e2e neume-docs-e2e notation-set-e2e notation-links-e2e plays-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install poppler
        if: matrix.poppler
        run: sudo apt-get install -y --no-install-recommends poppler-utils unzip

      - name: Start the dev server
        run: |
          npx ng serve --port 4299 > ng-serve.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4299/ > /dev/null; then echo "dev server is up"; exit 0; fi
            sleep 3
          done
          echo "dev server did not start"; cat ng-serve.log; exit 1

      # Every script runs even when an earlier one failed, so one run shows all that is broken.
      - name: Run the browser tests
        run: |
          failed=0
          for s in ${{ matrix.scripts }}; do
            echo "=== $s"
            node scripts/$s.mjs || { echo "FAILED: $s"; failed=1; }
          done
          exit $failed

  # Master only: the site is built while the tests run, so the deploy below has nothing left to build.
  # `npm run build` = ng build --configuration production --base-href ./
  # Emits into docs/ and copies src/CNAME → docs/CNAME (custom domain monodi.app).
  build-site:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Repository variables (Settings → Secrets and variables → Actions →
      # Variables). They are baked in at build time, so changing them needs a
      # new run. The client SECRET is never used here; it lives in the proxy.
      - name: Inject GitHub sign-in settings
        run: node scripts/inject-github-env.js
        env:
          MONODI_GH_CLIENT_ID: ${{ vars.MONODI_GH_CLIENT_ID }}
          MONODI_GH_PROXY_URL: ${{ vars.MONODI_GH_PROXY_URL }}
          MONODI_GH_APP_URL: ${{ vars.MONODI_GH_APP_URL }}

      - name: Build production app
        run: npm run build

      # The artifact deploy does not run Jekyll, but this makes it explicit
      # so filenames beginning with _ are never stripped.
      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Publish to GitHub Pages once everything passed.
  # Requires repo Settings → Pages → Source = "GitHub Actions".
  deploy-pages:
    needs: [build, unit-tests, e2e, build-site]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
