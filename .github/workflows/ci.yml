name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npx ng build --configuration production

      # The build does not check what templates use: a handler that was never written compiles fine.
      - name: Check template members
        run: node scripts/check-templates.mjs

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

  # Opens every page in a real browser (headless Chrome, seeded workspace) and clicks through the rows that open
  # sources and documents. Fails on console errors, change-detection warnings and settings tabs that render
  # nothing: the kind of break that builds fine and passes every unit test but is dead on arrival.
  # It needs the dev server (the Angular warnings it looks for only exist in development mode).
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start the dev server
        run: |
          npx ng serve --port 4299 > ng-serve.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4299/ > /dev/null; then echo "dev server is up"; exit 0; fi
            sleep 3
          done
          echo "dev server did not start"; cat ng-serve.log; exit 1

      - name: Smoke test
        run: node scripts/smoke-e2e.mjs

      # The metadata grid: filter "ID ends with GS" through the UI, select all matching rows, delete them through
      # the confirmation dialog and check in IndexedDB that exactly those documents are gone.
      - name: Metadata grid (filter and bulk delete)
        run: node scripts/metadata-grid-e2e.mjs

      # The grid as a spreadsheet: typing, ranges, fill, paste, undo, save (real keyboard and mouse events).
      - name: Metadata grid (editing)
        run: node scripts/metadata-edit-e2e.mjs

      # Prints all fixtures as one PDF and checks the page-break rules on where the export put things:
      # no heading alone at the bottom of a page, no single system of a line left alone at a page edge.
      - name: Print layout (page breaks)
        run: node scripts/layout-e2e.mjs

      # Placeholder notes on ZIP import: a lone D6/F3 under a word is removed (setting respected), an F3 inside a
      # real melody stays, a comment on a placeholder note moves onto its syllable.
      - name: Placeholder notes (ZIP import)
        run: node scripts/placeholder-import-e2e.mjs

      # The cover page and the volumes (one PDF per manuscript / region ..., zipped) through the real print
      # dialog; reads the PDFs back with poppler.
      - name: Cover page and volumes
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils unzip
          node scripts/cover-e2e.mjs

  # Build the Angular app and publish it to GitHub Pages (custom domain
  # monodi.app, preserved via src/CNAME which the build copies into docs/).
  # Requires repo Settings → Pages → Source = "GitHub Actions".
  deploy-pages:
    needs: [build-and-test, smoke-test]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` = ng build --configuration production --base-href ./
      # Emits into docs/ and copies src/CNAME → docs/CNAME (custom domain).
      # Repository variables (Settings → Secrets and variables → Actions →
      # Variables). They are baked in at build time, so changing them needs a
      # new run. The client SECRET is never used here; it lives in the proxy.
      - name: Inject GitHub sign-in settings
        run: node scripts/inject-github-env.js
        env:
          MONODI_GH_CLIENT_ID: ${{ vars.MONODI_GH_CLIENT_ID }}
          MONODI_GH_PROXY_URL: ${{ vars.MONODI_GH_PROXY_URL }}
          MONODI_GH_APP_URL: ${{ vars.MONODI_GH_APP_URL }}

      - name: Build production app
        run: npm run build

      # The artifact deploy does not run Jekyll, but this makes it explicit
      # so filenames beginning with _ are never stripped.
      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
